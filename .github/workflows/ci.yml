name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # The pure-TypeScript half: builds and tests anywhere.
  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v6

      - name: Install corepack
        run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -F @viren070/fsmux build

      - name: Typecheck
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm -F @viren070/fsmux test

  # The native half. Only Linux can host a FUSE mount, and the mount tests
  # need /dev/fuse, which GitHub's ubuntu runners provide.
  fuse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/fsmux-fuse/crate

      - name: Install fuse3
        run: sudo apt-get update && sudo apt-get install -y fuse3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: FUSE_NATIVE_REQUIRED=1 pnpm build

      - name: Test
        run: pnpm -F @viren070/fsmux-fuse test

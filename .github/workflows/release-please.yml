name: Release Please

on:
  push:
    branches:
      - main
  # Lets a publish that failed after the release was cut be retried without
  # cutting another one.
  workflow_dispatch:
    inputs:
      publish:
        description: Which package to publish
        required: true
        type: choice
        options: [fsmux, fsmux-fuse, both]
        default: both

permissions:
  contents: write
  pull-requests: write
  # Trusted publishing to npm: the workflow proves its identity with an OIDC
  # token instead of a long-lived NPM_TOKEN.
  id-token: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      fsmux: ${{ steps.release.outputs['packages/fsmux--release_created'] }}
      fuse: ${{ steps.release.outputs['packages/fsmux-fuse--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # fsmux is plain TypeScript, so nothing platform-specific is needed.
  publish-fsmux:
    needs: [release-please]
    if: ${{ !cancelled() && (needs.release-please.outputs.fsmux == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish != 'fsmux-fuse')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -F @viren070/fsmux build

      - name: Publish to npm
        run: pnpm -F @viren070/fsmux publish --access public --no-git-checks

  # fsmux-fuse ships prebuilt binaries so consumers never need a Rust
  # toolchain. All four Linux targets go in the one tarball: stripped cdylibs
  # at ~800 KB each are small enough that per-platform packages would be more
  # machinery than they are worth, and `nativeTarget()` picks the right one at
  # runtime.
  publish-fsmux-fuse:
    needs: [release-please]
    if: ${{ !cancelled() && (needs.release-please.outputs.fuse == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish != 'fsmux')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the TypeScript
        run: pnpm -F @viren070/fsmux build && pnpm -F @viren070/fsmux-fuse exec tsc

      - name: Build the addons
        run: |
          cd packages/fsmux-fuse
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                   x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            FUSE_NATIVE_REQUIRED=1 node build-native.mjs --target "$t" --cross-compile
          done

      - name: Show what will ship
        run: ls -la packages/fsmux-fuse/native

      - name: Publish to npm
        run: pnpm -F @viren070/fsmux-fuse publish --access public --no-git-checks
